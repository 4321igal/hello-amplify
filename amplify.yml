version: 1
env:
  variables:
    NODE_ENV: production

frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm install -g @aws-amplify/cli
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
