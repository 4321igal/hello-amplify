# Product Management GraphQL Schema
type Product @model @auth(rules: [{ allow: public }]) {
  id: ID!
  rawName: String!
  rawDescription: String!
  category: String!
  barcode: String
  image: String!
  isOverridden: Boolean
  status: ProductStatus!
  confidence: Float!
  
  # AI Generated Fields
  aiDescription: String
  aiTags: [String!]
  aiSEO: String
  targetAudience: String
  
  # Metadata
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  ownerId: String!
}

enum ProductStatus {
  PENDING
  READY
}

type Stats @model @auth(rules: [{ allow: public }]) {
  id: ID!
  total: Int!
  ready: Int!
  pending: Int!
  avgConfidence: Int!
  updatedAt: AWSDateTime!
}

type Query {
  # Get all products
  listAllProducts: [Product!]! @function(name: "listProducts-${env}")
  
  # Get stats
  getProductStats: Stats @function(name: "getStats-${env}")
  
  # Get single product
  getProduct(id: ID!): Product @function(name: "getProduct-${env}")
}

type Mutation {
  # Create product
  createProduct(
    rawName: String!
    rawDescription: String!
    category: String!
    barcode: String
    image: String!
  ): Product @function(name: "createProduct-${env}")
  
  # Update product
  updateProduct(
    id: ID!
    rawName: String
    rawDescription: String
    category: String
    image: String
    status: ProductStatus
    confidence: Float
    aiDescription: String
    aiTags: [String!]
    aiSEO: String
    targetAudience: String
  ): Product @function(name: "updateProduct-${env}")
  
  # Delete product
  deleteProduct(id: ID!): Boolean @function(name: "deleteProduct-${env}")
  
  # Run AI analysis
  runAIAnalysis(productId: ID!): Product @function(name: "runAIAnalysis-${env}")
  
  # Import CSV
  importProductsFromCSV(csvContent: String!): ImportResult @function(name: "importCSV-${env}")
}

type ImportResult {
  count: Int!
  success: Boolean!
  message: String!
  products: [Product!]
}
